  <circle cx="12" cy="6" r="1.5" fill="#9C27B0"/>
  <circle cx="18" cy="6" r="1.5" fill="#FF9800"/>
  
  <circle cx="8" cy="12" r="1.5" fill="#4CAF50"/>
