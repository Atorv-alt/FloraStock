<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Панель дашборда -->
  <rect x="2" y="2" width="20" height="20" rx="2" fill="#FFFFFF" stroke="#37474F" stroke-width="1"/>
  
  <!-- График/диаграмма -->
  <rect x="4" y="12" width="4" height="8" fill="#4CAF50"/>
  <rect x="10" y="8" width="4" height="12" fill="#2196F3"/>
  <rect x="16" y="10" width="4" height="10" fill="#FF9800"/>
  
  <!-- Статистика вверху -->
  <circle cx="6" cy="6" r="1.5" fill="#E91E63"/>
  <text x="8" y="7" font-family="Arial" font-size="3" fill="#37474F">+12%</text>
  
  <circle cx="12" cy="6" r="1.5" fill="#9C27B0"/>
  <text x="14" y="7" font-family="Arial" font-size="3" fill="#37474F">+8%</text>
  
  <circle cx="18" cy="6" r="1.5" fill="#4CAF50"/>
  <text x="20" y="7" font-family="Arial" font-size="3" fill="#37474F">+15%</text>
  
  <!-- Линия тренда -->
  <line x1="4" y1="11" x2="20" y2="11" stroke="#B0BEC5" stroke-width="0.5" stroke-dasharray="1,1"/>
</svg>
